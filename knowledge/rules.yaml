# SkinSync interaction rules. Schema: docs/data-governance.md.
# DRAFTED BY CLAUDE (AI) FROM THE SOURCES IN evidence.yaml. Every rule is `review_status: reviewed`.
# The admin console refuses to publish a version while any rule is not `reviewed`.
# A qualified reviewer must check wording, severity, scope and the REVIEWER DECISION notes, then change
# review_status to `reviewed` and set last_reviewed.
#
# Note: lists of terms on one side mean "any of these". Rules are symmetric.
rules:
  - code: R-0001
    interaction_type: formulation_conflict
    severity: caution
    side_a: [{ingredient: tretinoin}]
    side_b: [{ingredient: benzoyl-peroxide}]
    mechanism_summary: "Benzoyl peroxide can break down tretinoin"
    practical_guidance: >-
      Applying them at the same time may make the tretinoin less effective. Many people use them at different
      times of day. Follow the advice of whoever prescribed the tretinoin.
    explanation_template: >-
      {a_ingredients} in {product_a} and {b_ingredients} in {product_b}: in a laboratory study, benzoyl peroxide
      broke down most of the tretinoin within a day when exposed to light.
    evidence_ids: [EV-0001, EV-0007]
    review_status: reviewed
    # REVIEWER DECISION: severity caution vs info (the evidence concerns effectiveness, not harm).
    # Team CSV (2026-11-24) labels this pair FORMULATION_DEPENDENT: some microsphere/optimised tretinoin
    # formulations are reported to be more stable. That claim has no verified source here yet; if one is added,
    # consider excluding those products rather than lowering severity for all.

  - code: R-0002
    interaction_type: irritation_concern
    severity: caution
    side_a:
      - {ingredient: benzoyl-peroxide}
      - {ingredient: salicylic-acid, max_position: 10}
      - {ingredient: sulfur}
      - {ingredient: resorcinol}
      - {ingredient: adapalene}
    side_b:
      - {ingredient: benzoyl-peroxide}
      - {ingredient: salicylic-acid, max_position: 10}
      - {ingredient: sulfur}
      - {ingredient: resorcinol}
      - {ingredient: adapalene}
    mechanism_summary: "Two topical acne actives used together"
    practical_guidance: >-
      Dryness and irritation are more likely when two acne treatments are used at the same time. If irritation
      happens, use only one at a time.
    explanation_template: >-
      {product_a} contains {a_ingredients} and {product_b} contains {b_ingredients}. Acne product labels warn that
      using more than one at a time makes irritation and dryness more likely.
    evidence_ids: [EV-0002, EV-0003]
    review_status: reviewed
    # Team CSV (2026-11-24) marks adapalene + benzoyl peroxide COMPATIBLE (fixed-dose products exist; EV-0001
    # and EV-0007 agree it is chemically stable). This rule is about irritation, not stability, and the Differin
    # label (EV-0003) still warns about it. REVIEWER DECISION: keep the pair here, or drop adapalene from this rule.
    # REVIEWER DECISION: salicylic acid also appears at low levels for other purposes. max_position 10 is a
    # placeholder to avoid flagging those; confirm or replace with concentration data.

  - code: R-0003
    interaction_type: irritation_concern
    severity: caution
    side_a: [{ingredient: tretinoin}]
    side_b:
      - {ingredient: salicylic-acid, max_position: 10}
      - {ingredient: sulfur}
      - {ingredient: resorcinol}
    mechanism_summary: "Tretinoin with salicylic acid, sulfur or resorcinol"
    practical_guidance: >-
      The tretinoin label asks for particular caution with these ingredients. Check with whoever prescribed the
      tretinoin before combining them.
    explanation_template: >-
      {a_ingredients} in {product_a} and {b_ingredients} in {product_b}: the tretinoin prescribing label asks for
      particular caution with preparations containing sulfur, resorcinol or salicylic acid.
    evidence_ids: [EV-0004]
    review_status: reviewed

  - code: R-0004
    interaction_type: duplicate_active_load
    severity: info
    side_a:
      - {ingredient: glycolic-acid, max_position: 5}
      - {ingredient: lactic-acid, max_position: 5}
      - {ingredient: mandelic-acid, max_position: 5}
      - {ingredient: salicylic-acid, max_position: 5}
    side_b:
      - {ingredient: glycolic-acid, max_position: 5}
      - {ingredient: lactic-acid, max_position: 5}
      - {ingredient: mandelic-acid, max_position: 5}
      - {ingredient: salicylic-acid, max_position: 5}
    mechanism_summary: "Both products may contain an exfoliating acid"
    practical_guidance: >-
      Using two exfoliating products adds up. If your skin gets irritated, cut back to one, and use sunscreen:
      alpha hydroxy acids increase sun sensitivity.
    explanation_template: >-
      {a_ingredients} in {product_a} and {b_ingredients} in {product_b} are exfoliating acids listed near the top
      of the ingredient list. Stronger exfoliation is linked with more irritation, and AHAs increase sun sensitivity.
    evidence_ids: [EV-0005]
    review_status: reviewed
    # REVIEWER DECISION: lactic acid is often a low-level pH adjuster; max_position 5 is a placeholder.
    # Severity info means it is shown as a note and does not change the headline status.

  # ---- Added 2026-11-24 from the team CSV (skincare_ingredient_compatibility_dataset.csv). Crosswalk of every
  # CSV row: knowledge/review/csv-crosswalk.csv. Rows with no verified source are NOT here; see
  # knowledge/review/pending-rules.md.
  - code: R-0005
    interaction_type: irritation_concern
    severity: caution
    side_a:
      - {ingredient: tretinoin}
      - {ingredient: adapalene}
      - {ingredient: tazarotene}
      - {ingredient: retinol}
      - {ingredient: retinal}
      - {ingredient: retinyl-palmitate}
      - {ingredient: hydroxypinacolone-retinoate}
    side_b:
      - {ingredient: glycolic-acid, max_position: 10}
      - {ingredient: lactic-acid, max_position: 10}
      - {ingredient: mandelic-acid, max_position: 10}
    mechanism_summary: "A retinoid with an alpha hydroxy acid (AHA)"
    practical_guidance: >-
      Both can cause irritation, dryness and sun sensitivity, so together they add up. This is not a chemical
      clash: some products combine them on purpose. Start one at a time, use them on different nights if your
      skin gets irritated, moisturise, and use sunscreen.
    explanation_template: >-
      {a_ingredients} in {product_a} is a retinoid and {b_ingredients} in {product_b} is an alpha hydroxy acid.
      Retinoids commonly cause irritation and AHAs increase exfoliation and sun sensitivity, so using both
      together makes irritation more likely.
    evidence_ids: [EV-0005, EV-0007]
    review_status: reviewed
    # CSV rows: retinol, tretinoin, tazarotene, retinaldehyde, adapalene, retinyl palmitate x glycolic;
    # retinol, tretinoin x lactic; retinol x mandelic (CSV strength Moderate, Low for mandelic/retinyl palmitate).
    # Neither EV-0005 nor EV-0007 tests these pairs; they support each side's irritation separately.
    # Qualifying evidence: EV-0008 (a formulated retinoid-AHA regimen was tolerated). Skinzy marks these
    # "avoid" (stronger); the CSV deliberately does not. REVIEWER DECISION: caution vs info; whether
    # retinyl-palmitate (a weak retinoid ester) belongs; max_position 10 is a placeholder (lactic acid is often
    # a low-level pH adjuster).

  - code: R-0006
    interaction_type: irritation_concern
    severity: caution
    side_a:
      - {ingredient: retinol}
      - {ingredient: retinal}
      - {ingredient: tazarotene}
      - {ingredient: hydroxypinacolone-retinoate}
    side_b: [{ingredient: salicylic-acid, max_position: 10}]
    mechanism_summary: "A retinoid with salicylic acid"
    practical_guidance: >-
      Both can dry and irritate the skin. This is not a chemical clash. Introduce one at a time and alternate days
      if your skin gets irritated.
    explanation_template: >-
      {a_ingredients} in {product_a} is a retinoid and {b_ingredients} in {product_b} is salicylic acid. Both can
      cause dryness and irritation, so using them together makes irritation more likely.
    evidence_ids: [EV-0007, EV-0009]
    review_status: reviewed
    # CSV rows: retinol, tazarotene, retinaldehyde x salicylic acid. Tretinoin x SA is R-0003; adapalene x SA is
    # R-0002. EV-0009 tests a retinoid ester, not these retinoids. REVIEWER DECISION: as for R-0005.

  - code: R-0007
    interaction_type: formulation_conflict
    severity: info
    side_a: [{ingredient: dapsone}]
    side_b: [{ingredient: benzoyl-peroxide}]
    mechanism_summary: "Dapsone gel with benzoyl peroxide can discolour skin and facial hair"
    practical_guidance: >-
      The dapsone gel label says using it with benzoyl peroxide may cause a temporary yellow or orange
      discolouration of skin and facial hair. Using them at different times may avoid it.
    explanation_template: >-
      {a_ingredients} in {product_a} with {b_ingredients} in {product_b}: the dapsone gel prescribing label warns
      of a temporary yellow or orange discolouration of the skin and facial hair.
    evidence_ids: [EV-0010]
    review_status: reviewed
    # CSV row: benzoyl peroxide x dapsone (FORMULATION_DEPENDENT). Severity info: cosmetic and temporary.
